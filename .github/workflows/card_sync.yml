name: Card sync check

# Report only: compares each upcoming site card with UFC.com and writes the diff to the run
# summary. No write permission, no commits. A failed run (exit 1) means the card differs;
# the fix goes into data/card_overrides.json after a person checks it.
on:
  schedule:
    - cron: "17 14 * * *"   # daily; GitHub may delay scheduled runs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare site cards with UFC.com
        run: python3 -I scripts/card_sync_check.py --out sync_report.md
      - name: Publish report to the run summary
        if: always()
        run: test -f sync_report.md && cat sync_report.md >> "$GITHUB_STEP_SUMMARY" || echo "no report written" >> "$GITHUB_STEP_SUMMARY"

  live-overlay:
    # Block 55: runs form/app.js's own overlayLive() on the repo files. Red if fewer than all bouts on an upcoming
    # card get a live price, or a side gets another fighter's price. UFC 334 went 1 of 13 with nothing red.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Live prices applied to N of M
        run: set -o pipefail; node scripts/live_overlay_check.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  labs-card:
    # Block 57: Labs next-card rows must be the current card (red on a cancelled fighter, a wrong number or a missing bout).
    # Fix: python3 -I scripts/build_labs.py --upcoming-only
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Labs rows vs the upcoming card
        run: set -o pipefail; python3 -I scripts/labs_card_check.py | tee -a "$GITHUB_STEP_SUMMARY"
