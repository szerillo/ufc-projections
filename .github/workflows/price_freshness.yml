name: Price freshness check (fight weekend, report only)

# Kirk round 9/10: every 30 minutes from Friday 00:00 ET to Sunday 02:00 ET, check that every unstarted bout on the next card
# has an archive price no older than 4 hours (scripts/check_price_freshness.py, the same code the Friday refresh runs).
# Report only: it writes data/embeds/price_freshness_status.json and fails the run on a stale price. It changes nothing else.
# GitHub fires frequent schedules on this repo only every few hours (see odds_live.yml), so, like odds_live, each hourly tick
# starts a loop that stays alive and checks every 30 minutes until the window ends or ~5h40m pass; queued runs carry on.
on:
  schedule:
    - cron: '23 * * * 5,6,0'
  workflow_dispatch:
    inputs:
      max_minutes: {description: 'Loop length cap (test with 1)', default: '340'}
      force: {description: 'Check once even outside the window (test only)', default: 'false'}

permissions:
  contents: write

concurrency:
  group: price-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: check every 30 minutes inside the window
        env:
          MAX_MIN: ${{ inputs.max_minutes || '340' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -uo pipefail
          inwin() { python3 -c "import datetime as d, zoneinfo as z, sys; n=d.datetime.now(z.ZoneInfo('America/New_York')); w=n.weekday(); sys.exit(0 if (w==4 or w==5 or (w==6 and n.hour<2)) else 1)"; }
          EV=$(python3 -c "import json; i=json.load(open('form/data/index.json')); print('form/data/events/' + i['upcoming'][0]['slug'] + '.json')")
          end=$(( $(date +%s) + MAX_MIN * 60 )); fail=0
          while [ "$(date +%s)" -lt "$end" ]; do
            if inwin || [ "$FORCE" = "true" ]; then
              python3 -I scripts/check_price_freshness.py --event "$EV" --download --status data/embeds/price_freshness_status.json || fail=1
              git config user.name "price-freshness-bot"; git config user.email "price-freshness-bot@users.noreply.github.com"
              git add data/embeds/price_freshness_status.json && git commit -qm "price freshness $(date -u +%Y-%m-%dT%H:%MZ)" && (git pull -q --rebase && git push -q || echo "push failed")
              [ "$fail" = "1" ] && { echo "::error::stale price on the next card; see data/embeds/price_freshness_status.json"; exit 1; }
              [ "$FORCE" = "true" ] && exit 0
            else
              echo "outside Fri 00:00 - Sun 02:00 ET; exit"; exit 0
            fi
            sleep 1800
          done
