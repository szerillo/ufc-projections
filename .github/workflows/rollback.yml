name: Roll back projections

# One step to undo a bad Friday publish. Puts data/<slug>_projections.json (what the card page reads) back to the
# version from the promotion before the latest one (counting only promotions since the file was last deleted, so
# the Nov 11 dry runs never come back), or removes it when there is none (the page then shows
# "Projections coming"). It also removes data/pending/<slug>_projections.json so the bad file cannot be promoted again;
# the next "Publish to site" from the sheet writes a fresh one. Running it twice gives the same result (it counts
# promotions, not its own commits). To go back further, set steps.
#
# Start it either way:
#   - Actions > Roll back projections > Run workflow (slug, steps)      [needs this file on main]
#   - commit an empty file data/rollback/<slug>.txt on GitHub (Add file > Create new file); optional content = steps
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "card slug, e.g. ufc_334"
        required: true
        default: "ufc_334"
      steps:
        description: "how many promotions to go back (1 = the one before the latest)"
        required: false
        default: "1"
  push:
    paths:
      - "data/rollback/*.txt"

permissions:
  contents: write

concurrency:
  group: projections-${{ github.ref }}   # same group as the Projections check, so the two never interleave
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Roll back
        env:
          IN_SLUG: ${{ github.event.inputs.slug }}
          IN_STEPS: ${{ github.event.inputs.steps }}
        run: |
          set -euo pipefail
          git config user.name  'projections-bot'
          git config user.email 'projections-bot@users.noreply.github.com'
          if [ "${{ github.event_name }}" = "push" ]; then
            reqs=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" HEAD -- 'data/rollback/*.txt' 2>/dev/null || ls data/rollback/*.txt)
          else
            reqs="dispatch"
          fi
          done_any=0
          for r in $reqs; do
            if [ "$r" = "dispatch" ]; then slug="$IN_SLUG"; steps="${IN_STEPS:-1}"; else
              [ -f "$r" ] || continue
              slug=$(basename "$r" .txt); steps=$(tr -dc '0-9' < "$r"); steps=${steps:-1}
            fi
            if ! [[ "$slug" =~ ^[a-z0-9_]+$ ]] || ! [[ "$steps" =~ ^[1-9][0-9]?$ ]]; then echo "bad request: slug '$slug' steps '$steps'"; exit 1; fi
            f="data/${slug}_projections.json"
            # promotions since the file was last deleted (the pre-go-live cleanup deletes it, so dry runs never count)
            del=$(git log -1 --diff-filter=D --format=%H -- "$f" || true)
            mapfile -t P < <(git log --format=%H --grep='^projections: verified' ${del:+$del..HEAD} -- "$f")
            target="${P[$steps]:-}"
            before=$(sha256sum "$f" 2>/dev/null | cut -c1-12 || echo none)
            if [ -n "$target" ] && git cat-file -e "$target:$f" 2>/dev/null; then
              git show "$target:$f" > "$f"; git add "$f"
              what="restored $f to the version promoted in ${target:0:8}"
            else
              git rm -q --ignore-unmatch "$f"
              what="removed $f (no earlier promoted version), the page shows Projections coming"
            fi
            git rm -q --ignore-unmatch "data/pending/${slug}_projections.json"
            [ "$r" != "dispatch" ] && git rm -q --ignore-unmatch "$r"
            after=$(sha256sum "$f" 2>/dev/null | cut -c1-12 || echo none)
            echo "$what (sha256 $before -> $after)" | tee -a "$GITHUB_STEP_SUMMARY"
            done_any=1
          done
          [ "$done_any" = 1 ] || { echo "no rollback request found"; exit 0; }
          if git diff --cached --quiet; then echo "already rolled back, nothing to commit"; exit 0; fi
          git commit -q -m "projections: rolled back at $(date -u +%Y-%m-%dT%H:%MZ)"
          ok=0; for i in 1 2 3; do if git pull --rebase --quiet && git push; then ok=1; break; fi; sleep 5; done
          [ "$ok" = 1 ] || { echo "push failed after 3 tries; nothing changed on the site"; exit 1; }
